name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
        env:
          NODE_ENV: production
          DEPLOYMENT_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          INNGEST_EVENT_KEY: ci-event
          INNGEST_SIGNING_KEY: ci-signing
          PAID_PROVIDERS_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_PROBE_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_SHADOW_IMPORT_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_SHADOW_IMPORT_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_POLLING_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_POLLING_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_RECEIVER_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_RECEIVER_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_PROCESSING_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_PROCESSING_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_RESCUE_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_RESCUE_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_ROOFING_RESCUE_ACTIONS_ENABLED: "false"
          INTEGRATIONS_LEADCONDUIT_VIRTUAL_QUOTE_RESCUE_ACTIONS_ENABLED: "false"
          INTEGRATIONS_CALLTOOLS_ENABLED: "false"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run test:integration
      - run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts
