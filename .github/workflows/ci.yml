name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
        env:
          NODE_ENV: production
          DEPLOYMENT_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable
          SUPABASE_SERVICE_ROLE_KEY: ci-service
          INNGEST_EVENT_KEY: ci-event
          INNGEST_SIGNING_KEY: ci-signing
          PAID_PROVIDERS_ENABLED: "false"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run test:integration
      - run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/lib/database.types.ts /tmp/database.types.ts
