name: rake-automation

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?N8N_VERSION is required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: ${WEBHOOK_URL:?WEBHOOK_URL is required}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_METRICS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:-}
    expose: ["5678"]
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [internal, proxy]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]

networks:
  internal:
    internal: true
  proxy:

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
